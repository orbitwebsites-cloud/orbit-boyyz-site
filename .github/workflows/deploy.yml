name: Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Vercel
    env:
      VERCEL_ORG_ID: team_B7tKDOEe71bK8ojPoB0fM34F
      VERCEL_PROJECT_ID: prj_i8lnlTTaMXQTJsfMQEJI0zoarTww

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull Vercel project settings
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel reads the commit author from .git and enforces the Hobby-plan
      # "author must have project access" check even on token deploys.
      # Removing .git makes this a plain CLI deploy with no author to check.
      - name: Strip git metadata
        run: rm -rf .git

      - name: Deploy prebuilt output
        run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
